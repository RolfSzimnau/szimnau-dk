name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run so date-based checks (security.txt Expires) fail even without pushes
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run validate:src
      - run: npm run build
      - run: npm run validate
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
